name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile with warnings as errors
        run: make CC=${{ matrix.compiler }} CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -Werror -O2'
      - name: Run filesystem and terminal tests
        run: make test
      - name: Check root-specific defaults
        run: sudo python3 tests/test_ls.py ./ls
